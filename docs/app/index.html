<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5F4B">
<!--APP-->
<title>le bois スタッフ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column; sticky top bar, content, fixed bottom tab bar (4 tabs). Same palette as the le bois 日報 */
:root{
  --ground:#F1F5F3; --surface:#FFFFFF; --surface-2:#E9EFEC;
  --ink:#101E1A; --muted:#55665F; --line:#D3E0DB; --line-soft:#E3ECE8;
  --moss:#1F5F4B; --moss-soft:#E2EFE9; --btn-ink:#FFFFFF;
  --hand:#8F5212; --hand-soft:#F6EADC; --warn:#A03626; --warn-soft:#F8E6E2;
  --sq:#2C6E9E; --sq-soft:#E1EDF5;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1614; --surface:#15211E; --surface-2:#1C2A26;
  --ink:#E3EDE9; --muted:#9AADA7; --line:#2A3B36; --line-soft:#223330;
  --moss:#74C4A4; --moss-soft:#17322A; --btn-ink:#0D1614;
  --hand:#DBA362; --hand-soft:#2E2418; --warn:#E9917E; --warn-soft:#33201C;
  --sq:#83B9DD; --sq-soft:#152B3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1614; --surface:#15211E; --surface-2:#1C2A26;
  --ink:#E3EDE9; --muted:#9AADA7; --line:#2A3B36; --line-soft:#223330;
  --moss:#74C4A4; --moss-soft:#17322A; --btn-ink:#0D1614;
  --hand:#DBA362; --hand-soft:#2E2418; --warn:#E9917E; --warn-soft:#33201C;
  --sq:#83B9DD; --sq-soft:#152B3A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--ground)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sps{display:grid;gap:6px;margin:0 0 2px}.sps.two{grid-template-columns:1fr 1fr}.sp{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--line-soft);text-decoration:none}.sp img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover}.sps.two .sp img{height:120px;max-height:none}.hero .sp img{max-height:340px}.sp .tmp{position:absolute;left:6px;bottom:6px;font-size:10.5px;line-height:1.4;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:6px}
.photos{display:grid;gap:12px}.photos a{display:block;text-decoration:none;color:inherit}.photos img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--line-soft)}.photos figure{margin:0}.photos figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;min-height:36px;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--hand-soft);color:var(--hand);font-size:12.5px}

h1{font-size:22px;margin:6px 0 4px;text-wrap:balance;line-height:1.4}
h2{font-size:16px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.label{font-size:12px;color:var(--muted);letter-spacing:.04em}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;text-align:left;min-height:108px}
.tile b{font-size:15px}
.tile .num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .num small{font-size:13px;color:var(--muted);font-weight:500}
.meter{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--moss)}
.tile.done{border-color:var(--moss)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--moss-soft);color:var(--moss)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.q{background:var(--hand-soft);color:var(--hand)}
.shifts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}.shifts li{display:flex;align-items:center;gap:10px;font-size:14px}.shifts .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:86px}.shifts .nm{font-weight:700}.shifts .gap{color:var(--warn);font-weight:700}.shifts .nt{color:var(--hand)}.dayh{display:flex;align-items:baseline;gap:8px}.dayh b{font-size:15px}.dayh.today b{color:var(--moss)}
.pill.mute{background:var(--surface-2);color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 0;border-top:1px solid var(--line-soft);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;border-top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
tr.on td{color:var(--moss);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--moss);color:var(--btn-ink);font-weight:700;text-decoration:none;font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}

/* manual */
.groups{display:flex;flex-direction:column;gap:18px}
.group h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 2px 8px;letter-spacing:.06em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list a,.list button.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border:0;border-top:1px solid var(--line-soft);background:none;width:100%;text-align:left;text-decoration:none;color:inherit;min-height:52px}
.list > :first-child{border-top:0}
.list .t{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.list .t small{color:var(--muted);font-size:12px}
.chev{color:var(--muted);flex:none}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13px;min-height:36px}
.must{background:var(--moss);color:var(--btn-ink);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.6}
.must small{display:block;font-size:11px;letter-spacing:.1em;opacity:.85;font-weight:500}
.sec h2{font-size:15px;margin:0 0 6px}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.lines li{display:flex;gap:10px;align-items:flex-start}
.lines li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-top:.72em}
ol.lines{counter-reset:s}
ol.lines li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--moss-soft);color:var(--moss);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.lines .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.qline{font-size:12.5px;color:var(--hand);background:var(--hand-soft);border-radius:8px;padding:4px 9px;align-self:flex-start}

/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line-soft);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;min-height:52px}
.chk:first-child{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--surface)}
.chk[aria-checked="true"] .box{background:var(--moss);border-color:var(--moss);color:var(--btn-ink)}
.chk[aria-checked="true"] .ct{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk .ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.chk .by{font-size:11.5px;color:var(--muted);text-decoration:none}
.sectionh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 6px}
.sectionh h2{font-size:14px}
.sectionh span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sectionh .sh-r{display:flex;align-items:center;gap:8px}
.punchrow{display:flex;gap:8px;flex-wrap:wrap}.punchrow .btn{flex:1 1 40%;min-height:52px;font-size:16px}
.sectionh .bulk{padding:4px 10px;font-size:12px;min-height:30px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sticky-meter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--ground);padding-block:8px}

/* notes */
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);resize:vertical}
input[type=text]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.note{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line-soft)}
.note:first-child{border-top:0}
.note .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note.res p{color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);font-size:13.5px;padding:14px 16px;margin:0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
.tabs a[aria-current="page"]{color:var(--moss);font-weight:700}
.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* name dialog */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.tabs[hidden],.who[hidden]{display:none!important}
.login{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.login .names button{min-width:72px}
.login .names button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.pad button.x{font-size:14px;color:var(--mute)}
.mine{border-left:4px solid var(--ink)}
.sheet .in{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;min-height:38px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:10px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.err{color:var(--warn);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<!--/APP-->
</head>
<body>
<!--BODY-->
<div class="wrap">
  <header class="top">
    <div class="brand"><b>le bois スタッフ</b><span id="today"></span></div>
    <button class="who" id="who" type="button">名前を選ぶ</button>
  </header>
  <p class="demo" id="demo" hidden>お試しモードです。記録はこの端末にだけ残ります。</p>
  <main id="view"></main>
</div>

<div class="tabs"><nav aria-label="メイン">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</a>
  <a href="#check-open" data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 16h8"/></svg>チェック</a>
  <a href="#notes" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>引き継ぎ<span class="badge" id="badge" hidden></span></a>
  <a href="#manual" data-tab="manual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h10"/></svg>マニュアル</a>
</nav></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h">
  <form class="in" id="nameForm">
    <h2 id="sheet-h">あなたの名前</h2>
    <p class="sub">チェックやメモに名前が残ります。この端末に覚えておきます。</p>
    <div class="names" id="nameChips"></div>
    <label class="label" for="nameInput">名前</label>
    <input type="text" id="nameInput" maxlength="20" autocomplete="off" placeholder="例：ひろき">
    <div class="row"><button class="btn ghost" type="button" id="nameCancel">閉じる</button><button class="btn" type="submit">決定</button></div>
  </form>
</div>

<script src="config.js"></script>
<script src="content.js"></script>
<script>
(function(){
"use strict";
const C = window.LB_CONTENT, CFG = window.LB_CONFIG || {};
const STORE = CFG.store || "lebois";
const DEMO = /[?&]demo\b/.test(location.search);
const LIVE = !DEMO && !!(CFG.supabaseUrl && CFG.anonKey);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["日","月","火","水","木","金","土"];

/* ---------- 日付（東京） ---------- */
function jstNow(){ return new Date(Date.now() + 9*3600e3); }
function bizDate(d){ return (d || jstNow()).toISOString().slice(0,10); }
function fmtTime(iso){ const d = new Date(new Date(iso).getTime() + 9*3600e3); return (d.getUTCMonth()+1)+"/"+d.getUTCDate()+" "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); }

/* ---------- 端末に覚えるもの ---------- */
const mem = {
  get(k, d){ try{ const v = localStorage.getItem((DEMO ? "lbdemo_" : "lb_")+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem((DEMO ? "lbdemo_" : "lb_")+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 保存先 ---------- */
/* ログイン（名前＋4桁）。番号は Supabase 側で確かめる。端末には token だけ覚える */
const AUTH = { token: mem.get("token", ""), name: mem.get("authName", ""), role: mem.get("authRole", ""), id: mem.get("authId", "") };
function rpcHeaders(){
  const h = { apikey: CFG.anonKey, "Content-Type": "application/json" };
  if(!/^sb_/.test(CFG.anonKey || "")) h.Authorization = "Bearer " + CFG.anonKey;  // 旧形式の anon key のときだけ
  return h;
}
async function rpc(fn, args){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/,"") + "/rest/v1/rpc/" + fn, { method: "POST", headers: rpcHeaders(), body: JSON.stringify(args || {}) });
  const t = await r.text();
  let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok){
    const m = (j && j.message) || "";
    if(/login_required/.test(m)){ logout(true); throw new Error("もう一度ログインしてください"); }
    if(/locked/.test(m)) throw new Error("番号を5回まちがえたので15分お待ちください");
    throw new Error("保存先に接続できませんでした（" + r.status + "）");
  }
  return j;
}
function logout(silent){
  const t = AUTH.token;
  ["token","authName","authRole","authId"].forEach(k => mem.set(k, ""));
  AUTH.token = AUTH.name = AUTH.role = AUTH.id = "";
  if(t && !silent){ rpc("lb_logout", { p_token: t }).catch(() => {}); }
  updateWho(); render();
}
const remote = {
  async getRuns(date){ return rpc("lb_get_runs", { p_token: AUTH.token, p_date: date }); },
  async putRun(row){ return rpc("lb_put_run", { p_token: AUTH.token, p_list: row.list, p_date: row.biz_date, p_done: row.done, p_completed: !!row.completed_at }); },
  async getNotes(){ return rpc("lb_get_notes", { p_token: AUTH.token }); },
  async addNote(n){ return rpc("lb_add_note", { p_token: AUTH.token, p_kind: n.kind, p_body: n.body }); },
  async resolve(id){ return rpc("lb_resolve", { p_token: AUTH.token, p_id: id }); }
};
const local = {
  async getRuns(date){ return mem.get("runs", []).filter(r => r.biz_date === date); },
  async putRun(row){
    const all = mem.get("runs", []);
    const i = all.findIndex(r => r.list === row.list && r.biz_date === row.biz_date);
    const merged = Object.assign({}, i >= 0 ? all[i] : {}, row, { updated_at: new Date().toISOString() });
    if(i >= 0) all[i] = merged; else all.push(merged);
    mem.set("runs", all.slice(-60)); return merged;
  },
  async getNotes(){
    const since = Date.now() - 14*864e5;
    return mem.get("notes", []).filter(n => !n.resolved_at || new Date(n.created_at).getTime() >= since).sort((a,b) => b.created_at.localeCompare(a.created_at));
  },
  async addNote(n){ const all = mem.get("notes", []); all.push(Object.assign({ id: String(Date.now()) + Math.random().toString(36).slice(2,6), created_at: new Date().toISOString(), resolved_at: null }, n)); mem.set("notes", all.slice(-300)); },
  async resolve(id, by){ const all = mem.get("notes", []); const n = all.find(x => x.id === id); if(n){ n.resolved_at = new Date().toISOString(); n.resolved_by = by; } mem.set("notes", all); }
};
const db = LIVE ? remote : local;

/* ---------- 見本データ（?demo=1 で開いたときだけ） ---------- */
function seedDemo(real){
  const R = (real || []).filter(Boolean), A = R[0] || "はな", B = R[1] || "けい", Cn = R[2] || "ゆう";
  const today = bizDate(), y = bizDate(new Date(jstNow().getTime() - 864e5));

function demoShifts(real){

    [["早番","10:30","14:30",0],["終日","10:30","18:30",1]], [["終日","10:30","18:30",2],["遅番","14:30","18:30",-1]],

/* ---------- 打刻（アプリ → Apps Script → freee）。試行中は対象の人にだけ出る ---------- */
const PC = { enabled: false, available: [], clocks: [], msg: "", error: "", busy: false, at: 0 };
const PUNCH_LABEL = { clock_in: "出勤", break_begin: "休憩に入る", break_end: "休憩から戻る", clock_out: "退勤" };
async function punchCall(action){
  if(DEMO){
    const now = jstNow(), hm = String(now.getUTCHours()).padStart(2,"0") + ":" + String(now.getUTCMinutes()).padStart(2,"0");
    if(action !== "status"){ PC.clocks.push({ type: action, label: PUNCH_LABEL[action], at: hm }); PC.msg = PUNCH_LABEL[action] + "を記録しました（" + hm + "・見本）"; }
    const last = PC.clocks.length ? PC.clocks[PC.clocks.length-1].type : "";
    PC.enabled = true;
    PC.available = !last || last === "clock_out" ? (last ? [] : ["clock_in"]) : last === "break_begin" ? ["break_end"] : ["break_begin", "clock_out"];
    return;
  }
  if(!CFG.punchUrl || !AUTH.token) return;
  const r = await fetch(CFG.punchUrl, { method: "POST", body: JSON.stringify({ token: AUTH.token, action }) });
  const j = await r.json();
  if(j.error === "login_required"){ logout(); return; }
  PC.enabled = !!j.enabled; PC.error = j.ok ? "" : (j.error || "");
  if(j.ok){ PC.available = j.available || []; PC.clocks = j.clocks || []; PC.msg = j.msg || ""; }
}
async function loadPunch(force){
  if(!force && Date.now() - PC.at < 2*60e3) return;
  PC.at = Date.now();
  try{ await punchCall("status"); }catch(e){ PC.error = "打刻の状態を読み込めませんでした"; }
}
async function doPunch(action){
  if(PC.busy) return;
  if(action === "clock_out" && !confirm("退勤を記録しますか？")) return;
  PC.busy = true; PC.msg = ""; render();
  try{ await punchCall(action); if(PC.msg) toast(PC.msg); }
  catch(e){ PC.error = "通信できませんでした。もう一度押すか、freee のアプリで打刻してください"; }
  PC.busy = false; PC.at = Date.now(); render();
}
function viewPunch(){

$("#nameForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#nameInput").value.trim(); if(!v){ $("#nameInput").focus(); return; } mem.set("name", v); updateWho(); closeName(v); });
$("#nameCancel").addEventListener("click", () => closeName(null));
$("#who").addEventListener("click", () => { if(LIVE){ if(AUTH.token && confirm(AUTH.name + " さんをこの端末からログアウトしますか？")) logout(); return; } askName(); });
async function needName(){ if(LIVE) return AUTH.token ? AUTH.name : ""; return me() || await askName(); }
function updateWho(){ $("#who").textContent = me() ? me() + " さん" : (LIVE ? "ログイン" : "名前を選ぶ"); $("#who").hidden = LIVE && !AUTH.token; }

function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }

/* ---------- チェック ---------- */
function allItems(list){ return C.checklists[list].sections.flatMap(s => s.items.map(i => i[0])); }
function doneMap(list){ const r = S.runs[list]; const m = {}; (r && r.done || []).forEach(d => { m[d.id] = d; }); return m; }
function progress(list){ const ids = allItems(list), m = doneMap(list); const n = ids.filter(i => m[i]).length; return { n, total: ids.length }; }

async function toggle(list, id){ return setChecks(list, [id], null); }

/* ids の項目を on=true:済み / false:外す / null:反転 にする。bulk はまとめて押したしるし */
async function setChecks(list, ids, on, bulk){
  const who = await needName(); if(!who) return;
  try{
    const fresh = (await db.getRuns(S.date)).find(r => r.list === list);
    const done = (fresh && fresh.done || []).slice();
    const at = new Date().toISOString();
    ids.forEach(id => {
      const i = done.findIndex(d => d.id === id);
      const want = on === null ? i < 0 : on;
      if(want && i < 0) done.push(bulk ? { id, by: who, at, bulk: true } : { id, by: who, at });
      if(!want && i >= 0) done.splice(i, 1);
    });
    const have = new Set(done.map(d => d.id));
    const complete = allItems(list).every(x => have.has(x));
    const row = { list, biz_date: S.date, done, updated_by: who, updated_at: at, completed_at: complete ? ((fresh && fresh.completed_at) || at) : null };
    S.runs[list] = await db.putRun(row) || row;
    if(complete && !(fresh && fresh.completed_at)) toast(C.checklists[list].title + "のチェックが全部終わりました");
    else if(bulk) toast(ids.length + "項目をまとめて済みにしました");
    render();
  }catch(e){ toast(e.message); }
}

/* ---------- 引き継ぎ ---------- */
async function addNote(kind, body){
  const who = await needName(); if(!who) return false;
  try{ await db.addNote({ kind, body, staff: who }); await load(); toast(kind === "short" ? "不足リストに追加しました" : "引き継ぎを残しました"); return true; }
  catch(e){ toast(e.message); return false; }
}
async function resolveNote(id){
  const who = await needName(); if(!who) return;
  try{ await db.resolve(id, who); await load(); toast("解決済みにしました"); }catch(e){ toast(e.message); }
}

/* ---------- 画面 ---------- */
function stepPhotos(key){
  const ids = ((C.steps || {})[key] || []).filter(id => (C.shots || {})[id]);
  if(!ids.length) return "";
  return '<div class="sps' + (ids.length > 1 ? " two" : "") + '">' + ids.map(id => {
    const src = "img/steps/" + id + ".jpg";
    return '<a class="sp" href="' + esc(src) + '" target="_blank" rel="noopener"><img src="' + esc(src) + '" alt="' + esc(id) + '" decoding="async">' + (C.shots[id].tmp ? '<span class="tmp">紙の写真（仮）</span>' : "") + "</a>";
  }).join("") + "</div>";
}

function linesHtml(lines, ordered, key){
  const tag = ordered ? "ol" : "ul";
  return "<" + tag + ' class="lines">' + lines.map((l, i) => {
    const t = typeof l === "string" ? l : l.t, q = typeof l === "string" ? "" : l.q;
    return '<li><div class="body">' + (key ? stepPhotos(key + ":" + i) : "") + "<span>" + esc(t) + "</span>" + (q ? '<span class="qline">要確認：' + esc(q) + "</span>" : "") + "</div></li>";
  }).join("") + "</" + tag + ">";
}

  return '<div class="stack">' + viewPunch() + viewMyShift() + viewShiftCard() + viewAround() +
    '<div class="duo">' + tile("open", po) + tile("close", pc) + "</div>" +

      (shorts.length ? '<ul class="lines">' + shorts.slice(0,5).map(n => "<li><div class=\"body\"><span>" + esc(n.body) + '</span><span class="sub">' + esc(n.staff) + "・" + fmtTime(n.created_at) + "</span></div></li>").join("") + "</ul>" : '<p class="sub">いま足りないものはありません。</p>') +
    "</section>" +
    (lastNote ? '<section class="card"><div class="row"><h2>最新の引き継ぎ</h2><span class="sub">' + esc(lastNote.staff) + "・" + fmtTime(lastNote.created_at) + '</span></div><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">' + esc(lastNote.body) + "</p></section>" : "") +
    '<section class="card"><div class="row"><h2>明日の分の解凍</h2><span class="pill mute">退勤前に冷凍庫→冷蔵庫</span></div>' +
      (tomKind === "closed" ? '<p class="sub">明日（月曜）は定休日です。</p>' : '<p class="sub">明日は' + WD[tw] + "曜日（" + (tomKind === "weekend" ? "週末" : "平日") + "）</p>") +
      '<table><thead><tr><th>品目</th><th class="n">平日</th><th class="n">週末</th></tr></thead><tbody>' +
      C.thaw.map(t => '<tr><td>' + esc(t.item) + '<br><span class="sub">' + esc(t.note) + "</span>" + (t.q ? '<br><span class="qline">要確認：' + esc(t.q) + "</span>" : "") + '</td><td class="n' + (tomKind === "weekday" ? '" style="color:var(--moss);font-weight:700' : "") + '">' + esc(t.weekday) + '</td><td class="n' + (tomKind === "weekend" ? '" style="color:var(--moss);font-weight:700' : "") + '">' + esc(t.weekend) + "</td></tr>").join("") +
      "</tbody></table></section>" +
    '<section class="card"><h2>提供期限</h2><table><tbody>' + C.expiry.map(e => '<tr><td>' + esc(e.item) + '</td><td class="n" style="white-space:normal;text-align:right">' + esc(e.rule) + "</td></tr>").join("") + '</tbody></table><p class="sub">' + esc(C.expiryNote) + "</p></section>" +
    (CFG.nippoUrl ? '<a class="btn full" href="' + esc(CFG.nippoUrl) + '" target="_blank" rel="noopener">日報を送る（閉店後）</a>' : "") +
  "</div>";
}

function viewCheck(list){
  const L = C.checklists[list], m = doneMap(list), p = progress(list), r = S.runs[list];
  return '<div class="stack">' +
    '<div class="seg" role="group" aria-label="チェックの種類">' +
      '<button type="button" data-go="check-open" aria-pressed="' + (list === "open") + '">開店前</button>' +
      '<button type="button" data-go="check-close" aria-pressed="' + (list === "close") + '">閉店作業</button></div>' +
    '<div class="sticky-meter"><div class="row"><span class="label">' + esc(L.title) + "・" + S.date.slice(5).replace("-","/") + '</span><b style="font-variant-numeric:tabular-nums">' + p.n + " / " + p.total + '</b></div><div class="meter"><i style="width:' + (p.n/p.total*100) + '%"></i></div>' +
      (r && r.completed_at ? '<p class="sub" style="margin-top:4px">' + fmtTime(r.completed_at) + " にすべて完了</p>" : (p.n < p.total ? '<button type="button" class="btn sm ghost bulk-all" data-list="' + list + '" style="margin-top:8px">残り' + (p.total - p.n) + '項目をまとめて済みにする</button>' : "")) + "</div>" +
    L.sections.map(s => {
      const k = s.items.filter(i => m[i[0]]).length;
      const left = s.items.filter(i => !m[i[0]]).map(i => i[0]).join(",");
      return '<section><div class="sectionh"><h2>' + esc(s.h) + '</h2><span class="sh-r">' + (left ? '<button type="button" class="btn sm ghost bulk" data-list="' + list + '" data-ids="' + left + '">まとめて済み</button>' : "") + k + "/" + s.items.length + '</span></div><div class="list">' +
        s.items.map(i => { const d = m[i[0]]; return '<button type="button" class="chk" role="checkbox" aria-checked="' + !!d + '" data-list="' + list + '" data-id="' + i[0] + '"><span class="box" aria-hidden="true">' + (d ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>' : "") + '</span><span class="ct"><span>' + esc(i[1]) + "</span>" + (d ? '<span class="by">' + esc(d.by) + "・" + fmtTime(d.at).split(" ")[1] + (d.bulk ? "・まとめて" : "") + "</span>" : "") + "</span></button>"; }).join("") +
      "</div></section>";
    }).join("") +
    '<p class="sub">チェックは同じ日に出勤している人どうしで共有されます。押し直すと外せます。</p>' +
    '<details style="margin-top:4px"><summary class="sub" style="cursor:pointer;padding:4px 2px">紙のマニュアルを見る</summary><div style="margin-top:8px">' + photosHtml(list, list === "open" ? "開店前準備マニュアル（紙）" : "閉店作業マニュアル（紙）") + "</div></details>" +
  "</div>";
}

function viewNotes(){
  const shorts = S.notes.filter(n => n.kind === "short"), notes = S.notes.filter(n => n.kind === "note");
  const item = n => '<div class="note' + (n.resolved_at ? " res" : "") + '"><p>' + esc(n.body) + '</p><div class="meta"><span>' + esc(n.staff) + "・" + fmtTime(n.created_at) + "</span>" +
    (n.kind === "short" ? (n.resolved_at ? '<span class="pill mute">' + esc(n.resolved_by || "") + " が対応済み</span>" : '<button class="btn sm ghost" type="button" data-resolve="' + esc(n.id) + '">補充した</button>') : "") + "</div></div>";
  const open = shorts.filter(n => !n.resolved_at), done = shorts.filter(n => n.resolved_at);
  return '<div class="stack">' +
    '<section class="card"><h2>足りないもの</h2><p class="sub">買い出しや注文が要るものを書きます。補充したら「補充した」を押します。</p>' +
      '<form id="shortForm" class="stack" style="gap:8px"><label class="label" for="shortIn">足りないもの</label><input type="text" id="shortIn" maxlength="200" placeholder="例：牛乳 残り1本"><button class="btn" type="submit">不足リストに追加</button></form></section>' +
    '<div class="list">' + (open.length ? open.map(item).join("") : '<p class="empty">いま足りないものはありません。</p>') + "</div>" +
    (done.length ? '<details><summary class="sub" style="cursor:pointer;padding:4px 2px">対応済み（最近2週間）' + done.length + '件</summary><div class="list" style="margin-top:8px">' + done.map(item).join("") + "</div></details>" : "") +
    '<section class="card"><h2>引き継ぎ</h2><p class="sub">次に入る人に伝えたいことを書きます。紙の引き継ぎノートの代わりです。</p>' +
      '<form id="noteForm" class="stack" style="gap:8px"><label class="label" for="noteIn">引き継ぎ</label><textarea id="noteIn" maxlength="1000" placeholder="例：ガトーショコラ1本を冷蔵に移しました"></textarea><button class="btn" type="submit">引き継ぎを残す</button></form></section>' +
    '<div class="list">' + (notes.length ? notes.map(item).join("") : '<p class="empty">最近2週間の引き継ぎはありません。</p>') + "</div>" +
  "</div>";
}

function photosHtml(key, title){
  const list = (C.photos || {})[key]; if(!list || !list.length) return "";
  return '<section class="card sec"><h2>' + esc(title || "紙のマニュアル（写真）") + '</h2><p class="sub" style="margin:0 0 10px">タップすると大きく開きます。</p><div class="photos">' +
    list.map(p => '<figure><a href="' + esc(p.src) + '" target="_blank" rel="noopener"><img src="' + esc(p.src) + '" alt="' + esc(p.cap) + '" decoding="async"></a><figcaption>' + esc(p.cap) + "</figcaption></figure>").join("") + "</div></section>";
}

function viewManual(){
  const groups = {};
  C.manual.forEach(m => { (groups[m.group] = groups[m.group] || []).push(m); });
  const row = (href, t, small, tag) => '<a href="' + href + '"><span class="t"><span>' + esc(t) + "</span>" + (small ? "<small>" + esc(small) + "</small>" : "") + "</span>" + (tag || "") + '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>';
  return '<div class="groups">' +
    '<section class="group"><h2>まず見る</h2><div class="list">' + row("#m-expiry", "提供期限", "全品目の期限") + row("#m-layout", "キッチンの決まり", "グルグルの物・補充・電源・ギャラリー") + "</div></section>" +
    Object.keys(groups).map(g => '<section class="group"><h2>' + esc(g) + '</h2><div class="list">' + groups[g].map(m => row("#m-" + m.id, m.title, m.sub || "", m.flag ? '<span class="pill warn">' + esc(m.flag) + "</span>" : "")).join("") + "</div></section>").join("") +
    '<section class="group"><h2>手順の紙がまだないもの</h2><div class="card"><ul class="lines">' + C.missing.map(x => "<li><div class=\"body\"><span>" + esc(x) + "</span></div></li>").join("") + "</ul></div></section>" +
    '<p class="sub">マニュアルの版：' + esc(C.version) + "。オレンジの「要確認」は、まだ決まっていない点です。</p>" +
  "</div>";
}

function viewManualItem(id){
  const back = '<a class="back" href="#manual"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>マニュアル</a>';
  if(id === "expiry") return '<div class="stack">' + back + "<h1>提供期限</h1>" + '<div class="card"><table><tbody>' + C.expiry.map(e => "<tr><td>" + esc(e.item) + '</td><td class="n" style="white-space:normal;text-align:right">' + esc(e.rule) + "</td></tr>").join("") + '</tbody></table></div><div class="must">' + esc(C.expiryNote) + "</div>" + photosHtml("expiry") + "</div>";
  if(id === "layout") return '<div class="stack">' + back + '<h1>キッチンの決まり</h1><p class="sub">黄色いファイルの配置図より。</p>' + photosHtml("layout", "配置図") + C.layout.map(l => '<section class="card sec"><h2>' + esc(l.t) + "</h2>" + linesHtml([l.d]) + "</section>").join("") + "</div>";
  const m = C.manual.find(x => x.id === id); if(!m) return viewManual();
  return '<div class="stack">' + back +
    "<div><h1>" + esc(m.title) + "</h1>" + (m.sub ? '<p class="sub">' + esc(m.sub) + "</p>" : "") + (m.flag ? '<p style="margin:6px 0 0"><span class="pill warn">' + esc(m.flag) + "</span></p>" : "") + "</div>" +
    (stepPhotos(m.id + ":hero") ? '<div class="hero">' + stepPhotos(m.id + ":hero") + "</div>" : "") +
    (m.lead ? '<p style="margin:0">' + esc(m.lead) + "</p>" : "") +
    (m.must ? '<div class="must"><small>厳守</small>' + esc(m.must) + "</div>" : "") +
    m.sections.map((s, si) => '<section class="card sec"><h2>' + esc(s.h) + "</h2>" + stepPhotos(m.id + ":" + si) + linesHtml(s.lines, s.ordered, m.id + ":" + si) + "</section>").join("") +
    photosHtml(m.id, "元の紙（黄色いファイル）") +
  "</div>";
}

function route(){ return (location.hash || "#home").slice(1); }
function render(){
  const r = route();
  $("#today").textContent = (function(){ const d = jstNow(); return (d.getUTCMonth()+1) + "月" + d.getUTCDate() + "日（" + WD[d.getUTCDay()] + "）"; })();
  let html, tab;
  if(LIVE && !AUTH.token){
    $("#view").innerHTML = viewLogin();
    document.querySelector(".tabs").hidden = true; $("#who").hidden = true;
    return;
  }
  document.querySelector(".tabs").hidden = false;
  if(r.startsWith("check-")){ const l = r.slice(6) === "close" ? "close" : "open"; mem.set("lastList", l); html = viewCheck(l); tab = "check"; }
  else if(r === "notes"){ html = viewNotes(); tab = "notes"; }
  else if(r === "shift"){ html = viewShift(); tab = "home"; }
  else if(r === "manual"){ html = viewManual(); tab = "manual"; }
  else if(r.startsWith("m-")){ html = viewManualItem(r.slice(2)); tab = "manual"; }
  else { html = viewHome(); tab = "home"; }
  if(S.error && tab !== "manual") html = '<p class="err">' + esc(S.error) + "。電波を確認して開き直してください。</p>" + html;
  const keep = document.activeElement && document.activeElement.id;
  const vals = {}; ["shortIn","noteIn"].forEach(k => { const el = document.getElementById(k); if(el) vals[k] = el.value; });
  $("#view").innerHTML = html;
  Object.keys(vals).forEach(k => { const el = document.getElementById(k); if(el) el.value = vals[k]; });
  if(keep && document.getElementById(keep) && /In$/.test(keep)) document.getElementById(keep).focus();
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  const ck = document.querySelector('.tabs a[data-tab="check"]'); ck.setAttribute("href", "#check-" + mem.get("lastList", "open"));
  const nShort = S.notes.filter(n => n.kind === "short" && !n.resolved_at).length;
  $("#badge").hidden = !nShort; $("#badge").textContent = nShort;
}

$("#view").addEventListener("click", e => {
  const pb = e.target.closest(".punch"); if(pb){ doPunch(pb.dataset.a); return; }
  const bk = e.target.closest(".bulk"); if(bk){ setChecks(bk.dataset.list, bk.dataset.ids.split(","), true, true); return; }
  const ba = e.target.closest(".bulk-all"); if(ba){ const l = ba.dataset.list, m = doneMap(l), left = allItems(l).filter(i => !m[i]);
    if(left.length && confirm("残りの" + left.length + "項目をまとめて済みにしますか？\n（あとから1つずつ外せます）")) setChecks(l, left, true, true); return; }
  const c = e.target.closest(".chk"); if(c){ toggle(c.dataset.list, c.dataset.id); return; }
  const g = e.target.closest("[data-go]"); if(g){ location.hash = g.dataset.go; return; }
  const rs = e.target.closest("[data-resolve]"); if(rs){ resolveNote(rs.dataset.resolve); }
});
$("#view").addEventListener("submit", async e => {
  e.preventDefault();
  if(e.target.id === "shortForm"){ const v = $("#shortIn").value.trim(); if(!v) return $("#shortIn").focus(); if(await addNote("short", v)) $("#shortIn").value = ""; }
  if(e.target.id === "noteForm"){ const v = $("#noteIn").value.trim(); if(!v) return $("#noteIn").focus(); if(await addNote("note", v)) $("#noteIn").value = ""; }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
setInterval(() => { if(!document.hidden && !(document.activeElement || document.body).matches("input,textarea")) load(); }, 30000);

if(DEMO){
  $("#demo").innerHTML = '確認用の画面です。スタッフの名前とシフトは本物、チェックや引き継ぎの中身は見本です。押したりメモしたりしても本番には残りません。 <button type="button" id="demoReset" style="margin-left:4px;border:0;background:none;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0">見本を最初に戻す</button>';
  $("#demoReset").addEventListener("click", () => { seedDemo(staffNames()); load(); toast("見本データを最初の状態に戻しました"); });
}
$("#demo").hidden = LIVE;
updateWho();
render();
if(DEMO){
  (CFG.supabaseUrl ? rpc("lb_staff_list", {}).then(l => { DEMO_NAMES = (l || []).map(x => x.name); }).catch(() => {}) : Promise.resolve())
  .then(() => loadShifts(true)).then(() => { const n = staffNames(); if(mem.get("seeded", "") !== bizDate() + (n.length ? "|real" : "")) seedDemo(n); return load(); }).then(render);
  loadPunch(true).then(render);
}else if(!LIVE || AUTH.token){
  load();
  loadShifts(true).then(render);
  loadPunch(true).then(render);
}
setInterval(() => { if(!document.hidden){ loadShifts().then(render); loadPunch().then(render); } }, 60000);
})();
