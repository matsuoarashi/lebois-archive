<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>le bois 日報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
  :root{
    --ground:#F1F5F3; --surface:#FFFFFF; --surface-2:#E9EFEC; --chat:#DDE7EC;
    --ink:#101E1A; --muted:#5C6E69; --line:#D3E0DB; --line-soft:#E3ECE8;
    --moss:#1F5F4B; --moss-soft:#E2EFE9; --sq:#2C6E9E; --sq-soft:#E1EDF5;
    --hand:#9A5B18; --hand-soft:#F6EADC; --warn:#A03626; --warn-soft:#F8E6E2;
    --btn-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(16,30,26,.05), 0 10px 30px -20px rgba(16,30,26,.35);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#0D1614; --surface:#15211E; --surface-2:#1C2A26; --chat:#101C22;
    --ink:#E3EDE9; --muted:#94A8A2; --line:#2A3B36; --line-soft:#223330;
    --moss:#74C4A4; --moss-soft:#17322A; --sq:#83B9DD; --sq-soft:#152B3A;
    --hand:#DBA362; --hand-soft:#2E2418; --warn:#E9917E; --warn-soft:#33201C;
    --btn-ink:#0D1614;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
  }}
  :root[data-theme="dark"]{
    --ground:#0D1614; --surface:#15211E; --surface-2:#1C2A26; --chat:#101C22;
    --ink:#E3EDE9; --muted:#94A8A2; --line:#2A3B36; --line-soft:#223330;
    --moss:#74C4A4; --moss-soft:#17322A; --sq:#83B9DD; --sq-soft:#152B3A;
    --hand:#DBA362; --hand-soft:#2E2418; --warn:#E9917E; --warn-soft:#33201C;
    --btn-ink:#0D1614;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 14px 40px;min-height:100vh;
    display:flex;flex-direction:column;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px;gap:10px;}
  .topbar .who{font-size:13px;font-weight:700;}
  .topbar .when{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
    font-weight:400;display:block;}
  .gear{background:none;border:1px solid var(--line);border-radius:100px;color:var(--muted);
    font-family:inherit;font-size:11.5px;padding:5px 13px;cursor:pointer;flex:none;}
  .gear:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}

  .bars{display:flex;gap:5px;padding:0 2px 9px;}
  .bars i{flex:1;height:4px;border-radius:2px;background:var(--line);}
  .bars i.on.s-au{background:var(--sq);}
  .bars i.on.s-me{background:var(--hand);}
  .bars i.on.s-nn{background:var(--muted);}
  .bars i.skip{opacity:.35;}

  .legend{display:flex;gap:6px;padding:0 2px 15px;flex-wrap:wrap;}
  .src{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;
    padding:3px 9px;border-radius:100px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .src::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
  .src.sq{background:var(--sq-soft);color:var(--sq);}
  .src.me{background:var(--hand-soft);color:var(--hand);}

  .pane{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:22px 20px 20px;flex:1;}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--moss);margin:0 0 8px;}
  .q{font-size:21px;font-weight:700;line-height:1.45;margin:0 0 6px;}
  .qsub{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.7;}

  .banner{border-radius:11px;padding:11px 13px;font-size:12px;line-height:1.7;
    margin:0 0 18px;display:flex;gap:9px;align-items:flex-start;}
  .banner .src{flex:none;margin-top:2px;}
  .banner.sq{background:var(--sq-soft);color:var(--sq);}
  .banner.me{background:var(--hand-soft);color:var(--hand);}
  .banner b{font-weight:700;}

  .tag{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.04em;
    padding:1px 6px;border-radius:100px;margin-left:6px;vertical-align:1px;}
  .tag.sq{background:var(--sq-soft);color:var(--sq);}
  .tag.me{background:var(--hand-soft);color:var(--hand);}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 13px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;}
  .row .nm{font-size:14px;line-height:1.35;min-width:0;}
  .row .nm i{font-style:normal;color:var(--muted);font-size:11px;display:block;line-height:1.5;}
  .stp{display:flex;align-items:center;gap:4px;flex:none;}
  .stp button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;
    font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0;}
  .stp button:active{background:var(--surface-2);}
  .stp button:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}
  .stp input{width:46px;padding:6px 2px;border:1px solid var(--line);border-radius:8px;
    background:var(--ground);color:var(--hand);text-align:center;
    font-family:"IBM Plex Mono",monospace;font-size:15px;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;}
  .stp input.zero{color:var(--muted);opacity:.6;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input:focus-visible{outline:2px solid var(--moss);outline-offset:1px;}
  select{padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
    color:var(--muted);font-size:10.5px;font-family:inherit;}
  select:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}

  /* count card */
  .cnt{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
  .cnt.ok{border-color:var(--moss);background:var(--moss-soft);}
  .cnt.bad{border-color:var(--warn);background:var(--warn-soft);}
  .cnt .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px;}
  .cnt .nm{font-size:14.5px;font-weight:700;}
  .cnt .exp{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--sq);
    font-variant-numeric:tabular-nums;text-align:right;flex:none;}
  .cnt .in{display:flex;gap:8px;}
  .cnt .cell{flex:1;display:flex;flex-direction:column;gap:4px;}
  .cnt .cell label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
    color:var(--muted);display:flex;align-items:center;gap:5px;}
  .cnt .cell input{width:100%;padding:9px 6px;border:1px solid var(--line);border-radius:9px;
    background:var(--surface);color:var(--hand);text-align:center;
    font-family:"IBM Plex Mono",monospace;font-size:17px;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;}
  .cnt .res{margin-top:9px;font-size:11.5px;font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;}
  .cnt .res .g{color:var(--moss);} .cnt .res .r{color:var(--warn);font-weight:500;}

  .money{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;}
  .money.big{border-width:2px;border-color:var(--hand);}
  .money.info{background:var(--sq-soft);border-color:var(--sq);}
  .money.calc{background:var(--moss-soft);border-color:var(--moss);}
  .money .lb{font-size:13.5px;}
  .money .lb i{font-style:normal;color:var(--muted);font-size:11px;display:block;line-height:1.5;}
  .money input{width:120px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--ground);color:var(--hand);text-align:right;
    font-family:"IBM Plex Mono",monospace;font-size:16px;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;}
  .money .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-variant-numeric:tabular-nums;}
  .money.info .v,.money.info .lb{color:var(--sq);}
  .money.calc .v,.money.calc .lb{color:var(--moss);}

  .choice{display:flex;gap:8px;margin-top:10px;}
  .choice button{flex:1;padding:11px 6px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;
    font-weight:500;cursor:pointer;}
  .choice button.on{background:var(--moss);color:var(--btn-ink);border-color:var(--moss);}
  .choice button:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}

  details.more{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:10px;}
  summary{cursor:pointer;font-size:12.5px;color:var(--moss);padding:5px 0;}
  summary:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}
  .sgroup{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:14px 0 7px;}

  .sum{background:var(--surface-2);border-radius:13px;padding:14px 15px;font-size:12.5px;
    line-height:1.9;margin-bottom:14px;}
  .sum b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  .sum hr{border:none;border-top:1px solid var(--line);margin:9px 0;}

  .rep{background:var(--chat);border-radius:13px;padding:13px 11px;}
  .bub{background:var(--surface);border-radius:14px;border-bottom-left-radius:4px;
    padding:12px 14px;white-space:pre-wrap;font-size:12px;line-height:1.85;
    font-family:"IBM Plex Mono","Zen Kaku Gothic New",monospace;
    box-shadow:0 1px 2px rgba(0,0,0,.07);max-height:340px;overflow-y:auto;}
  .fmt{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap;}
  .fmt label{cursor:pointer;position:relative;display:inline-block;}
  .fmt input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer;}
  .fmt span{display:inline-block;font-size:11.5px;padding:5px 12px;border-radius:100px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);}
  .fmt input:checked+span{background:var(--moss);color:var(--btn-ink);border-color:var(--moss);}
  .fmt input:focus-visible+span{outline:2px solid var(--moss);outline-offset:2px;}

  .nav{display:flex;gap:9px;margin-top:20px;}
  .nav button{padding:15px;border-radius:13px;border:none;font-family:inherit;
    font-size:15px;font-weight:700;cursor:pointer;}
  .nav .prim{flex:1;background:var(--moss);color:var(--btn-ink);}
  .nav .ghost{flex:0 0 88px;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:13.5px;}
  .nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .nav .prim[disabled]{opacity:.4;cursor:default;}

  .status{font-size:12px;margin-top:12px;padding:10px 13px;border-radius:9px;display:none;}
  .status.ok{display:block;background:var(--moss-soft);color:var(--moss);}
  .status.ng{display:block;background:var(--warn-soft);color:var(--warn);}
  .note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:12px;}
  .trial{background:var(--hand-soft);border-left:2px solid var(--hand);padding:10px 13px;
    border-radius:0 3px 3px 0;font-size:11.5px;line-height:1.7;margin-top:14px;}
  .trial b{color:var(--hand);}
  .future{border:1px dashed var(--line);border-radius:11px;padding:12px 14px;
    font-size:11.5px;line-height:1.8;color:var(--muted);margin-top:14px;}
  .future b{color:var(--ink);}
  .future .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0;}
  .hist{font-size:12.5px;}
  .hrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
    border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums;}
  .hrow:last-child{border-bottom:none;}
  .hrow span:first-child{font-family:"IBM Plex Mono",monospace;color:var(--muted);flex:none;}
  .hrow .r{text-align:right;font-family:"IBM Plex Mono",monospace;}
</style>
</head>

<script>
/* ------------------------------------------------------------------
   STORE（本番版）: Google Apps Script 経由でスプレッドシートに読み書きします。
   Code.gs の getState / submitDay / getToday を呼びます。
   ------------------------------------------------------------------ */
var STORE = (function(){
  function run(){ return google.script.run; }
  return {
    load: function(cb){
      run().withSuccessHandler(function(st){ cb(st); })
           .withFailureHandler(function(){ cb(null); })
           .getState();
    },
    save: function(state, entry, ok, ng){
      run().withSuccessHandler(function(res){
              if(res && res.ok) ok();
              else ng((res && res.message) || '保存できませんでした。');
            })
           .withFailureHandler(function(err){ ng('保存できませんでした：' + (err && err.message || '')); })
           .submitDay(entry);
    },
    today: function(ok, ng){
      run().withSuccessHandler(function(d){ ok(d); })
           .withFailureHandler(function(err){ ng('Squareから取得できませんでした：' + (err && err.message || '')); })
           .getToday();
    }
  };
})();

</script>
<script>

(function(){
  var P = [
    {k:'cheese',  n:'チーズケーキ',     u:'切れ', b:'本',    per:7, fu:'b'},
    {k:'gateau',  n:'ガトーショコラ',   u:'切れ', b:'本',    per:9, fu:'b'},
    {k:'chiffon', n:'シフォンケーキ',   u:'個',   b:'ロール', per:8, fu:'u'},
    {k:'croque',  n:'クロックムッシュ', u:'食',   b:null,    per:1, fu:'u'}
  ];
  var MAP = [
    {sq:'チーズケーキ',             k:'cheese',  mul:1},
    {sq:'チーズケーキ（1本）',       k:'cheese',  mul:7},
    {sq:'ガトーショコラ',           k:'gateau',  mul:1},
    {sq:'シフォンケーキ（チョコ）',   k:'chiffon', mul:1},
    {sq:'シフォンケーキ（オレンジ）', k:'chiffon', mul:1},
    {sq:'クロックムッシュ',         k:'croque',  mul:1}
  ];

  var state;
  try{ state = JSON.parse(document.getElementById('state').textContent); }catch(e){ state = {}; }
  if(!state.stock) state.stock = {};
  P.forEach(function(p){ if(!state.stock[p.k]) state.stock[p.k] = {fz:0, ch:0}; });
  if(!state.log) state.log = [];
  if(!state.items) state.items = [];
  if(typeof state.float !== 'number') state.float = 0;

  var STEPS = ['今日のデータ', '在庫を数える', '差の確認', 'レジ金', '送信'];
  var SRC = [null, 'au', 'me', 'me', 'me', 'nn'];
  var ui = {step:1, done:false, fmt:'std', msg:'', ok:true};

  var form = {sales:0, cash:0, payout:0, counted:0,
              q:{}, arr:{}, fz:{}, fzu:{}, ch:{}, reason:{}, newNames:['',''], newQty:[0,0]};
  P.forEach(function(p){
    form.arr[p.k]=0; form.fzu[p.k]=p.fu; form.reason[p.k]=null;
    form.fz[p.k]= p.fu==='b' ? Math.round(state.stock[p.k].fz/p.per) : state.stock[p.k].fz;
    form.ch[p.k]= state.stock[p.k].ch;
  });

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'; }); }
  function yen(v){ return '¥' + Math.round(v).toLocaleString('ja-JP'); }
  function today(){
    var d = new Date(), w = ['日','月','火','水','木','金','土'][d.getDay()];
    return {iso:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
            label:(d.getMonth()+1)+'/'+d.getDate()+'('+w+')',
            time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  }
  function bundles(p, pieces){
    if(!p.b || pieces <= 0) return '';
    var whole = Math.floor(pieces/p.per), rem = pieces % p.per;
    if(whole === 0) return '';
    return rem === 0 ? '（'+whole+p.b+'）' : '（'+whole+p.b+'＋'+rem+p.u+'）';
  }
  function names(){ return MAP.map(function(m){return m.sq;}).concat(state.items); }
  function soldList(){
    var out = [];
    names().forEach(function(nm){ if((form.q[nm]||0) > 0) out.push({name:nm, qty:form.q[nm]}); });
    form.newNames.forEach(function(nm,i){
      if(nm && nm.trim() && form.newQty[i] > 0) out.push({name:nm.trim(), qty:form.newQty[i], isNew:true});
    });
    return out;
  }

  function compute(){
    var sold = {}; P.forEach(function(p){ sold[p.k]=0; });
    var list = soldList();
    list.forEach(function(it){
      MAP.forEach(function(m){ if(m.sq === it.name) sold[m.k] += it.qty * m.mul; });
    });
    var out = {_list:list};
    P.forEach(function(p){
      var prev = state.stock[p.k];
      var arrPieces = p.b ? form.arr[p.k] * p.per : form.arr[p.k];
      var expect = prev.fz + prev.ch + arrPieces - sold[p.k];
      var fzPieces = form.fzu[p.k] === 'b' ? form.fz[p.k] * p.per : form.fz[p.k];
      var actual = fzPieces + form.ch[p.k];
      var diff = actual - expect;
      out[p.k] = {sold:sold[p.k], arrPieces:arrPieces, expect:expect,
                  fzPieces:fzPieces, ch:form.ch[p.k], actual:actual, diff:diff,
                  waste: (diff < 0 && form.reason[p.k] === 'waste') ? -diff : 0,
                  unexp: (diff !== 0 && form.reason[p.k] !== 'waste') ? diff : 0};
    });
    return out;
  }
  function diffs(){
    var c = compute();
    return P.filter(function(p){ return c[p.k].diff !== 0; });
  }

  function buildReport(fmt){
    var c = compute(), t = today();
    var theo = state.float + form.cash - form.payout, d = form.counted - theo;
    var list = c._list.slice().sort(function(a,b){ return b.qty-a.qty; });
    var total = list.reduce(function(a,b){ return a+b.qty; }, 0);
    var L = [t.label + ' 日報', ''];
    if(fmt !== 'short'){
      L.push('【売上】');
      L.push('総売上 ' + yen(form.sales) + (total ? '（'+total+'点）' : ''));
      L.push('うち現金 ' + yen(form.cash));
      L.push('');
      L.push('【売れたもの】');
      if(list.length) list.forEach(function(it){ L.push(it.name + ' ' + it.qty); });
      else L.push('（なし）');
      L.push('');
    }
    L.push('【在庫数】');
    P.forEach(function(p){
      var r = c[p.k];
      L.push('▼' + p.n);
      L.push('冷凍' + r.fzPieces + p.u + bundles(p, r.fzPieces));
      L.push('冷蔵' + r.ch + p.u);
      if(r.waste > 0) L.push('廃棄' + r.waste + p.u);
    });
    var un = P.filter(function(p){ return c[p.k].unexp !== 0; });
    if(un.length){
      L.push('');
      L.push('【差異】');
      un.forEach(function(p){
        var v = c[p.k].unexp;
        L.push(p.n + ' ' + (v>0?'+':'') + v + p.u + '（原因不明）');
      });
    }
    if(fmt === 'full'){
      var a = [];
      P.forEach(function(p){ if(form.arr[p.k] > 0) a.push(p.n+' '+form.arr[p.k]+(p.b||p.u)); });
      if(a.length){ L.push(''); L.push('【入荷】'); L.push(a.join(' / ')); }
    }
    if(fmt !== 'short'){
      L.push('');
      L.push('【レジ締め】');
      if(fmt === 'full'){
        L.push('理論 ' + yen(theo) + '（釣銭 ' + yen(state.float) + ' ＋ 現金 ' + yen(form.cash)
          + (form.payout ? ' − 出金 ' + yen(form.payout) : '') + '）');
        L.push('実査 ' + yen(form.counted));
        L.push('差異 ' + (d===0?'±0':(d>0?'+':'')+d.toLocaleString('ja-JP')));
      } else {
        L.push('実査 ' + yen(form.counted) + ' ／ 差異 ' + (d===0?'±0':(d>0?'+':'')+d.toLocaleString('ja-JP')));
      }
    }
    return L.join('\n');
  }

  function paint(){
    var s = document.getElementById('status');
    if(!s) return;
    s.className = 'status ' + (ui.ok ? 'ok' : 'ng');
    s.textContent = ui.msg;
  }

  function submit(){
    var c = compute(), t = today(), list = c._list;
    var entry = {d:t.iso, label:t.label, sales:form.sales, cash:form.cash,
      tx:list.reduce(function(a,b){return a+b.qty;},0), counted:form.counted,
      diff: form.counted - (state.float + form.cash - form.payout)};
    var items = state.items.slice();
    list.forEach(function(it){
      if(!it.isNew) return;
      if(MAP.some(function(m){return m.sq===it.name;}) || items.indexOf(it.name)>=0) return;
      items.push(it.name);
    });
    var next = {v:5, float:state.float, items:items, stock:{}, log:[entry].concat(state.log).slice(0,30)};
    P.forEach(function(p){ next.stock[p.k] = {fz:c[p.k].fzPieces, ch:c[p.k].ch}; });
    entry.detail = {};
    P.forEach(function(p){
      entry.detail[p.k] = {fz:c[p.k].fzPieces, ch:c[p.k].ch, sold:c[p.k].sold,
                           arr:c[p.k].arrPieces, expect:c[p.k].expect,
                           waste:c[p.k].waste, gap:c[p.k].unexp};
    });
    entry.items = list.map(function(x){ return {n:x.name, q:x.qty}; });
    state = next; ui.done = true; ui.msg = '保存しています…'; ui.ok = true; render();
    STORE.save(next, entry,
      function(){ ui.msg = '保存しました。明日はこの在庫が「あるはずの数」の出発点になります。'; ui.ok = true; paint(); },
      function(m){ ui.msg = m || '保存できませんでした。報告文はコピーして使えます。'; ui.ok = false; paint(); });
  }

  function copyReport(){
    var el = document.getElementById('bub'); if(!el) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(el.textContent).then(function(){
        var b = document.getElementById('copybtn');
        b.textContent = 'コピーしました';
        setTimeout(function(){ b.textContent = '報告文をコピー'; }, 1800);
      }).catch(sel);
    } else sel();
    function sel(){ var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  }

  function stepper(id, val){
    return '<span class="stp"><button type="button" data-step="-1" data-t="'+id+'" aria-label="減らす">−</button>'
      + '<input type="number" inputmode="numeric" data-f="'+id+'" value="'+(val||0)+'" class="'+((val)?'':'zero')+'">'
      + '<button type="button" data-step="1" data-t="'+id+'" aria-label="増やす">＋</button></span>';
  }

      + '<input type="number" inputmode="numeric" data-f="'+id+'" value="'+val+'" aria-label="'+label+'"></div>';

  function setVal(k, v){
    if(k.indexOf('q:')===0){ form.q[k.slice(2)] = v; return; }
    if(k.indexOf('arr:')===0){ form.arr[k.slice(4)] = v; return; }
    if(k.indexOf('fzu:')===0){ form.fzu[k.slice(4)] = v; return; }
    if(k.indexOf('fz:')===0){ form.fz[k.slice(3)] = v; return; }
    if(k.indexOf('ch:')===0){ form.ch[k.slice(3)] = v; return; }
    if(k==='nq0'){ form.newQty[0]=v; return; }
    if(k==='nq1'){ form.newQty[1]=v; return; }
    if(k==='nn0'){ form.newNames[0]=v; return; }
    if(k==='nn1'){ form.newNames[1]=v; return; }
    form[k] = v;
  }
  function getVal(k){
    if(k.indexOf('q:')===0) return form.q[k.slice(2)]||0;
    if(k.indexOf('arr:')===0) return form.arr[k.slice(4)];
    if(k.indexOf('fz:')===0) return form.fz[k.slice(3)];
    if(k.indexOf('ch:')===0) return form.ch[k.slice(3)];
    if(k==='nq0') return form.newQty[0];
    if(k==='nq1') return form.newQty[1];
    return form[k]||0;
  }
  function liveMoney(){
    var theo = state.float + form.cash - form.payout, d = form.counted - theo;
    var a = document.getElementById('theov'); if(a) a.textContent = yen(theo);
    var b = document.getElementById('theosub');
    if(b) b.textContent = '釣銭 '+yen(state.float)+' ＋ 現金売上 '+yen(form.cash)+(form.payout?' − 出金 '+yen(form.payout):'');
    var e = document.getElementById('diffv');
    if(e){ e.textContent = (d===0?'±0':(d>0?'+':'')+d.toLocaleString('ja-JP'));
           e.style.color = d===0?'var(--moss)':'var(--warn)'; }
  }

  function liveCount(){
    var c = compute();
    P.forEach(function(p){
      var r = c[p.k];
      var card = document.querySelector('[data-card="'+p.k+'"]');
      if(card) card.className = 'cnt' + (r.diff===0 ? ' ok' : ' bad');
      var tt = document.querySelector('[data-tot="'+p.k+'"]');
      if(tt) tt.textContent = '数えた合計 ' + r.actual + p.u;
      var df = document.querySelector('[data-dif="'+p.k+'"]');
      if(df){
        df.className = (r.diff===0 ? 'g' : 'r');
        df.textContent = (r.diff===0 ? 'ぴったり' : (r.diff>0?'+':'')+r.diff+p.u);
      }
    });
  }

  function wire(){
    document.querySelectorAll('[data-f]').forEach(function(el){
      el.addEventListener(el.tagName==='SELECT'?'change':'input', function(){
        var k = el.getAttribute('data-f');
        setVal(k, el.type==='number' ? (parseFloat(el.value)||0) : el.value);
        if(el.type==='number') el.classList.toggle('zero', !parseFloat(el.value));
        if(ui.step === 2) liveCount();
        else liveMoney();
      });
    });
    document.querySelectorAll('[data-step]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-t');
        var v = Math.max(0, getVal(k) + parseInt(b.getAttribute('data-step'),10));
        setVal(k, v);
        var inp = document.querySelector('[data-f="'+k+'"]');
        if(inp){ inp.value = v; inp.classList.toggle('zero', !v); }
      });
    });
    document.querySelectorAll('[data-r]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-k'), r = b.getAttribute('data-r');
        form.reason[k] = (form.reason[k] === r) ? null : r;
        render();
      });
    });
    var b;
    if((b = document.getElementById('next'))) b.addEventListener('click', function(){
      if(ui.step === 5){ submit(); return; }
      if(ui.step === 2 && diffs().length === 0){ ui.step = 4; } else { ui.step++; }
      ui.msg=''; render();
    });
    if((b = document.getElementById('prev'))) b.addEventListener('click', function(){
      if(ui.step === 4 && diffs().length === 0){ ui.step = 2; } else { ui.step--; }
      ui.msg=''; render();
    });
    if((b = document.getElementById('gear'))) b.addEventListener('click', function(){
      ui.step = (ui.step===0)?1:0; render();
    });
    if((b = document.getElementById('copybtn'))) b.addEventListener('click', copyReport);
    if((b = document.getElementById('applysetup'))) b.addEventListener('click', function(){
      P.forEach(function(p){
        var f = document.querySelector('[data-s="fz_'+p.k+'"]'), g = document.querySelector('[data-s="ch_'+p.k+'"]');
        state.stock[p.k] = {fz: parseFloat(f.value)||0, ch: parseFloat(g.value)||0};
        form.fz[p.k] = form.fzu[p.k]==='b' ? Math.round(state.stock[p.k].fz/p.per) : state.stock[p.k].fz;
        form.ch[p.k] = state.stock[p.k].ch;
      });
      var fl = document.querySelector('[data-s="float"]');
      if(fl) state.float = parseFloat(fl.value)||0;
      ui.msg = '直しました。送信すると保存されます。'; ui.ok = true; ui.step = 1; render();
    });
    document.querySelectorAll('input[name=fmt]').forEach(function(r){
      r.addEventListener('change', function(){ ui.fmt = r.value; render(); });
    });
  }

  function resetForm(){
    P.forEach(function(p){
      form.fz[p.k] = form.fzu[p.k]==='b' ? Math.round(state.stock[p.k].fz/p.per) : state.stock[p.k].fz;
      form.ch[p.k] = state.stock[p.k].ch;
    });
  }

  /* 起動：保存済みの状態を読み、そのあと今日の自動データを取りにいく */
  render();
  if(STORE.load) STORE.load(function(st){
    if(st && st.stock){ state = st; resetForm(); render(); }
    if(!STORE.today) return;
    ui.msg = '今日のデータを取得しています…'; ui.ok = true; paint();
    STORE.today(function(d){
      if(d){
        if(typeof d.sales === 'number') form.sales = d.sales;
        if(typeof d.cash === 'number') form.cash = d.cash;
        if(d.items) Object.keys(d.items).forEach(function(nm){
          form.q[nm] = d.items[nm];
          var known = MAP.some(function(m){return m.sq===nm;}) || state.items.indexOf(nm)>=0;
          if(!known) state.items.push(nm);
        });
        if(d.arrivals) Object.keys(d.arrivals).forEach(function(k){ form.arr[k] = d.arrivals[k]; });
        ui.msg = d.note || '今日のデータが入りました。'; ui.ok = true;
      } else {
        ui.msg = '今日のデータを取得できませんでした。手で入れてください。'; ui.ok = false;
      }
      render();
    }, function(m){ ui.msg = m || '今日のデータを取得できませんでした。手で入れてください。'; ui.ok = false; render(); });
  });
})();
</script>
</body>
</html>
